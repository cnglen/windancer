name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Verify rustup and WASM target
      run: |
        rustup --version

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      
    - name: Build
      run: |
        cargo build
