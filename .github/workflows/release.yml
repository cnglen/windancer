name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: '手动发布的版本号 (例如 v1.0.0)'
        required: true
        default: 'v0.2.0'

env:
  CARGO_TERM_COLOR: always
        
jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: windancer
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: windancer.exe
    
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Verify rustup
      run: |
        rustup --version

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      
    - name: Build
      run: |
        cargo build -r --target ${{ matrix.target }}

    - name: Archive Release (Linux)
      if: runner.os == 'Linux'
      run: tar -czf windancer-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release ${{ matrix.bin }}
    - name: Archive Release (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.bin }} -DestinationPath windancer-${{ matrix.target }}.zip
        
    - name: Upload Final Bundle
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.target }}
        path: windancer-${{ matrix.target }}.*

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_version || github.ref_name }}
          name: Release ${{ github.event.inputs.release_version || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            windancer-*.tar.gz
            windancer-*.zip


